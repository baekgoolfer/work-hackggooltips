name: Bug report
description: Something does not work as documented
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste or attach recordings, transcripts, meeting notes, meeting titles, names, e-mail addresses, API keys or unredacted logs.** This tool records other people. Describe the problem in your own words; a synthetic example is enough.

        Local logs contain meeting titles and transcript snippets unless you set `LOG_CONTENT=0` in your `config.env`. Set it before you collect any log lines.

        **Security problem?** Do not open an issue. Use the repository's Security tab, "Report a vulnerability" (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you see, and when (during install, setup, a call, processing)?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The commands you ran and what you did in the call, in order.
      placeholder: |
        1. make install ARGS="--python --with-silero --pre-download-model"
        2. ...
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Meeting platform
      options:
        - Zoom
        - Microsoft Teams
        - Google Meet (ENABLED_PLATFORMS includes meet)
        - Manual recording (menu item)
        - Not related to a call (install, build, docs)
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      description: "Output of `sw_vers -productVersion`, and the chip (for example M3)."
      placeholder: "15.1, M3"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: "The release tag, or the output of `git rev-parse --short HEAD`."
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: How the app was installed
      options:
        - Built from source, ad-hoc signed (the default)
        - Built from source with the fixed signing identity (make signing-identity)
        - Prebuilt zip from a release
        - Organisation mode package (experimental)
        - Other
    validations:
      required: true
  - type: dropdown
    id: claude-mode
    attributes:
      label: Claude mode
      options:
        - "CLAUDE_AUTH=api"
        - "CLAUDE_AUTH=subscription"
        - Local-only meeting (no Claude)
        - Not relevant
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: "Output of mcap doctor --share"
      description: |
        Run it from the repository folder. `--share` replaces your home folder and e-mail addresses. Read the output before you paste it.
        `cd pipeline && "$HOME/Library/Application Support/MeetingCapture/venv/bin/python" -m mcap doctor --share`
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines (optional)
      description: "Only the few lines that matter, from ~/Library/Logs/MeetingCapture/, with LOG_CONTENT=0. Remove anything that identifies a person or a meeting."
      render: text
  - type: checkboxes
    id: confirmations
    attributes:
      label: Before you submit
      options:
        - label: I removed recordings, transcripts, notes, meeting titles, names, e-mail addresses and API keys from everything I pasted.
          required: true
        - label: I searched the existing issues and the Troubleshooting section of the README.
          required: true
